name: Prepare daily news
on:
  schedule:
    # UTC 22:30–23:55 covers Tokyo 07:30 and Shanghai 07:30, including retries.
    # Stored server timezone is authoritative; Python skips runs outside 07:30–07:59.
    - cron: '30,35,40,45,50,55 22,23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '手动执行（仍遵守当日幂等，不重复已完成制稿）'
        type: boolean
        default: true
      request_job:
        description: '后台任务 ID（可留空）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: techswipe-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.NEWS_AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
      NEWS_AUTOMATION_TOKEN: ${{ secrets.NEWS_AUTOMATION_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      GITHUB_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      FORCE: ${{ inputs.force }}
      REQUEST_JOB: ${{ inputs.request_job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r agent/requirements.txt
      - name: Collect, deduplicate and prepare Chinese drafts
        run: |
          args=(prepare)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$REQUEST_JOB" ]; then args+=(--request-job "$REQUEST_JOB"); fi
          python -m agent.pipeline "${args[@]}"
